name: Deploy infrastructure on an AWS EC2 instance

on:
  workflow_dispatch:

jobs:
  docker-build-and-deploy:
    name: 🐳 Build and deploy Docker images
    runs-on: ubuntu-latest
    env:
      REGISTRY_PUBLIC_IP: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}
      REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: $REGISTRY_PUBLIC_IP
          username: $REGISTRY_USERNAME
          password: $REGISTRY_PASSWORD
      - name: Tag and push images to private registry
        run: |
          # todo: create a SEMVER tag
          API_IMAGE="${REGISTRY_PUBLIC_IP}/api_python:latest"
          WEB_IMAGE="${REGISTRY_PUBLIC_IP}/web_react:latest"

          docker tag api_python "$API_IMAGE"
          docker tag web_react "$WEB_IMAGE"

          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"

  terraform:
    name: 🚀 Deploy infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: docker-build-and-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - name: Setup AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "eu-west-3"
      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=infra fmt -check -recursive
        continue-on-error: true
      - name: Terraform Init
        id: init
        run: terraform -chdir=infra init
        continue-on-error: true
      - name: Terraform Validate
        id: validate
        run: terraform -chdir=infra validate -no-color
        continue-on-error: true
      - name: Terraform Plan
        id: plan
        run: terraform -chdir=infra plan -no-color -input=false
        continue-on-error: true
      - name: Terraform Pre-Apply Checklist
        id: checklist
        if: always()
        run: |
          failed=0

          if [[ "${{ steps.fmt.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Format Check passed."
          else
            echo "[ERROR] Terraform Format Check failed (outcome: ${{ steps.fmt.outcome }})."
            failed=1
          fi

          if [[ "${{ steps.init.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Init passed."
          else
            echo "[ERROR] Terraform Init failed (outcome: ${{ steps.init.outcome }})."
            failed=1
          fi

          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Validate passed."
          else
            echo "[ERROR] Terraform Validate failed (outcome: ${{ steps.validate.outcome }})."
            failed=1
          fi

          if [[ "${{ steps.plan.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Plan passed."
          else
            echo "[ERROR] Terraform Plan failed (outcome: ${{ steps.plan.outcome }})."
            failed=1
          fi

          if [[ "$failed" -eq 0 ]]; then
            echo "[SUCCESS] All Terraform pre-apply checks passed."
          else
            echo "[ERROR] One or more Terraform pre-apply checks failed."
          fi

          exit "$failed"
      - name: Terraform Apply
        id: apply
        run: terraform -chdir=infra apply -auto-approve
