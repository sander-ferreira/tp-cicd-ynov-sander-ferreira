name: Deploy infrastructure on an AWS EC2 instance

on:
  workflow_dispatch:

jobs:
  # Job 1 : Build et push images
  docker-build-and-deploy:
    name: Build and deploy Docker images
    runs-on: ubuntu-latest
    env:
      REGISTRY_PUBLIC_IP: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}
      REGISTRY_USERNAME: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Docker to trust private registry
        run: |
          sudo mkdir -p /etc/docker/certs.d/${REGISTRY_PUBLIC_IP}
          echo "${{ secrets.REGISTRY_CERT }}" | sudo tee /etc/docker/certs.d/${REGISTRY_PUBLIC_IP}/ca.crt
          sudo systemctl restart docker

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}
          username: ${{ secrets.PRIVATE_REGISTRY_USERNAME }}
          password: ${{ secrets.PRIVATE_REGISTRY_PASSWORD }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}/api_python:latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}/web_react:latest

      - name: Build & push MySQL
        uses: docker/build-push-action@v5
        with:
          context: ./mysql
          push: true
          tags: ${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }}/mysql:latest

  # Job 2 : Terraform
  terraform:
    name: Deploy infrastructure with Terraform
    runs-on: ubuntu-latest
    needs: docker-build-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=infra fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform -chdir=infra init
        continue-on-error: true

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=infra validate -no-color
        continue-on-error: true

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=infra plan -no-color -input=false
        continue-on-error: true

      - name: Terraform Pre-Apply Checklist
        id: checklist
        if: always()
        run: |
          failed=0
          if [[ "${{ steps.fmt.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Format Check passed."
          else
            echo "[ERROR] Terraform Format Check failed."
            failed=1
          fi
          if [[ "${{ steps.init.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Init passed."
          else
            echo "[ERROR] Terraform Init failed."
            failed=1
          fi
          if [[ "${{ steps.validate.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Validate passed."
          else
            echo "[ERROR] Terraform Validate failed."
            failed=1
          fi
          if [[ "${{ steps.plan.outcome }}" == "success" ]]; then
            echo "[OK] Terraform Plan passed."
          else
            echo "[ERROR] Terraform Plan failed."
            failed=1
          fi
          if [[ "$failed" -eq 0 ]]; then
            echo "[SUCCESS] All Terraform pre-apply checks passed."
          else
            echo "[ERROR] One or more Terraform pre-apply checks failed."
          fi
          exit "$failed"

      - name: Terraform Apply
        run: terraform -chdir=infra apply -auto-approve

      # Bridge : Terraform -> Ansible
      # Écrit la clé SSH dans un fichier temporaire et expose l'IP avec GITHUB_ENV
      - name: Write SSH private key
        run: |
          KEY_FILE="$RUNNER_TEMP/key.pem"
          terraform -chdir=infra output -raw private_key_pem > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "ANSIBLE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Capture instance IP
        run: |
          echo "INSTANCE_IP=$(terraform -chdir=infra output -raw instance_ip)" >> "$GITHUB_ENV"

      - name: Generate inventory.ini
        run: |
          echo "[web]" > inventory.ini
          echo "$INSTANCE_IP ansible_user=ubuntu ansible_ssh_private_key_file=$ANSIBLE_KEY_FILE ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: inventory.ini

  # Job 3 : Ansible + validation
  ansible:
    name: Configure and deploy with Ansible
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-3

      # Recrée la clé SSH depuis Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init & get outputs
        run: |
          terraform -chdir=infra init
          KEY_FILE="$RUNNER_TEMP/key.pem"
          terraform -chdir=infra output -raw private_key_pem > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "ANSIBLE_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"
          echo "INSTANCE_IP=$(terraform -chdir=infra output -raw instance_ip)" >> "$GITHUB_ENV"

      - name: Install Ansible
        run: pip install ansible

      - name: Wait for SSH to be ready
        run: |
          for i in $(seq 1 20); do
            ssh -i "$ANSIBLE_KEY_FILE" -o StrictHostKeyChecking=no ubuntu@$INSTANCE_IP "echo ready" && break
            echo "Waiting for SSH... ($i/20)"
            sleep 10
          done

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i inventory.ini ansible/playbook.yml \
            --extra-vars "registry_ip=${{ secrets.PRIVATE_REGISTRY_PUBLIC_IP }} \
                          registry_user=${{ secrets.PRIVATE_REGISTRY_USERNAME }} \
                          registry_password=${{ secrets.PRIVATE_REGISTRY_PASSWORD }} \
                          registry_cert='${{ secrets.REGISTRY_CERT }}' \
                          mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                          mysql_database=${{ secrets.MYSQL_DATABASE }} \
                          mysql_user=${{ secrets.MYSQL_USER }}"

      # Validation
      - name: Wait for services to start
        run: sleep 30

      - name: Validate Frontend
        run: |
          curl -f http://$INSTANCE_IP:3000 \
            && echo "Frontend OK" || (echo "Frontend KO" && exit 1)

      - name: Validate API
        run: |
          curl -f http://$INSTANCE_IP:8000/health \
            && echo "API OK" || (echo "API KO" && exit 1)

      - name: Print application URL
        run: echo "Application disponible sur http://$INSTANCE_IP:3000"
