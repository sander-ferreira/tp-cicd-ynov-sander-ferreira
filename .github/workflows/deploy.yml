name: Deploy

on:
  workflow_dispatch:

jobs:

  # ── JOB 1 : BUILD & PUSH IMAGES ──────────────────────────────────────────
  # Pousse les images vers le registry Docker privé AWS (HTTPS self-signed)
  build-and-push:
    name: Build & Push images to private registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Le registry AWS utilise un certificat self-signed → on configure Docker
      # pour lui faire confiance sur le runner CI
      - name: Configure Docker to trust private registry
        run: |
          sudo mkdir -p /etc/docker/certs.d/${{ secrets.REGISTRY_IP }}
          echo "${{ secrets.REGISTRY_CERT }}" | sudo tee /etc/docker/certs.d/${{ secrets.REGISTRY_IP }}/ca.crt
          sudo systemctl restart docker

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_IP }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push API
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ secrets.REGISTRY_IP }}/api:latest

      - name: Build & push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: ${{ secrets.REGISTRY_IP }}/frontend:latest

      - name: Build & push MySQL
        uses: docker/build-push-action@v5
        with:
          context: ./mysql
          push: true
          tags: ${{ secrets.REGISTRY_IP }}/mysql:latest

  # ── JOB 2 : TERRAFORM ────────────────────────────────────────────────────
  terraform:
    name: Provision infrastructure (Terraform)
    runs-on: ubuntu-latest
    needs: build-and-push
    outputs:
      instance_ip: ${{ steps.tf-output.outputs.instance_ip }}
      private_key: ${{ steps.tf-output.outputs.private_key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init

      - name: Terraform Apply
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve

      - name: Get Terraform outputs
        id: tf-output
        working-directory: infra
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "instance_ip=$(terraform output -raw instance_ip)" >> $GITHUB_OUTPUT
          echo "private_key<<EOF" >> $GITHUB_OUTPUT
          terraform output -raw private_key_pem >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # ── JOB 3 : BRIDGE ───────────────────────────────────────────────────────
  bridge:
    name: Bridge Terraform → Ansible
    runs-on: ubuntu-latest
    needs: terraform

    steps:
      - name: Write SSH private key
        run: |
          echo "${{ needs.terraform.outputs.private_key }}" > key.pem
          chmod 600 key.pem

      - name: Generate inventory.ini
        run: |
          echo "[web]" > inventory.ini
          echo "${{ needs.terraform.outputs.instance_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> inventory.ini

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ansible-artifacts
          path: |
            key.pem
            inventory.ini

  # ── JOB 4 : ANSIBLE + VALIDATION ─────────────────────────────────────────
  ansible:
    name: Configure & Deploy (Ansible)
    runs-on: ubuntu-latest
    needs: [terraform, bridge]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ansible-artifacts

      - name: Fix key permissions
        run: chmod 600 key.pem

      - name: Install Ansible
        run: pip install ansible

      - name: Wait for SSH to be ready
        run: |
          for i in $(seq 1 20); do
            ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@${{ needs.terraform.outputs.instance_ip }} "echo ready" && break
            echo "Waiting for SSH... ($i/20)"
            sleep 10
          done

      - name: Run Ansible playbook
        run: |
          ansible-playbook -i inventory.ini ansible/playbook.yml \
            --extra-vars "registry_ip=${{ secrets.REGISTRY_IP }} \
                          registry_user=${{ secrets.REGISTRY_USER }} \
                          registry_password=${{ secrets.REGISTRY_PASSWORD }} \
                          registry_cert='${{ secrets.REGISTRY_CERT }}' \
                          mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }} \
                          mysql_database=${{ secrets.MYSQL_DATABASE }} \
                          mysql_user=${{ secrets.MYSQL_USER }}"

      - name: Wait for services to start
        run: sleep 30

      - name: Validate Frontend
        run: |
          curl -f http://${{ needs.terraform.outputs.instance_ip }}:3000 \
            && echo "Frontend OK" || (echo "Frontend PAS OK" && exit 1)

      - name: Validate API
        run: |
          curl -f http://${{ needs.terraform.outputs.instance_ip }}:8000/health \
            && echo "API OK" || (echo "API PAS OK" && exit 1)
