---
- name: Déploiement d'un Registry Docker Sécurisé
  hosts: registry_hosts
  become: true
  vars:
    project_dir: "/home/ubuntu/registry"
    public_ip: "{{ ansible_host }}"
    registry_admin_user: admin

  tasks:
    # 1. Installation Docker + outils
    - name: Installation des paquets
      apt:
        update_cache: yes
        name:
          - docker.io
          - docker-compose-v2
          - apache2-utils
          - openssl
        state: present

    - name: Ajout user au groupe docker
      user:
        name: ubuntu
        groups: docker
        append: yes

    # 2. Création des dossiers
    - name: Création des dossiers
      file:
        path: "{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - "{{ project_dir }}"
        - "{{ project_dir }}/auth"
        - "{{ project_dir }}/data"
        - "{{ project_dir }}/nginx"
        - "{{ project_dir }}/nginx/certs"

    # 3. Génération mot de passe htpasswd
    - name: Génération mot de passe htpasswd
      command: htpasswd -Bbn {{ registry_admin_user }} {{ registry_admin_password }}
      register: htpasswd_output
      no_log: true

    - name: Écriture du fichier registry.password
      copy:
        content: "{{ htpasswd_output.stdout }}\n"
        dest: "{{ project_dir }}/auth/registry.password"
        owner: ubuntu
        group: ubuntu
        mode: '0640'
      no_log: true

    # 4. Génération du certificat SSL self-signed
    - name: Génération du certificat SSL self-signed (avec SAN)
      command: >
        openssl req -x509 -nodes -newkey rsa:4096
        -keyout {{ project_dir }}/nginx/certs/registry.key
        -out {{ project_dir }}/nginx/certs/registry.crt
        -days 365
        -subj "/C=FR/ST=IDF/L=Paris/O=YNOV/CN={{ public_ip }}"
        -addext "subjectAltName=IP:{{ public_ip }}"
      args:
        creates: "{{ project_dir }}/nginx/certs/registry.crt"

    - name: Permissions sur les certificats
      file:
        path: "{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: '0600'
      loop:
        - "{{ project_dir }}/nginx/certs/registry.key"
        - "{{ project_dir }}/nginx/certs/registry.crt"

    # 5. Copie de la config nginx
    - name: Copie de la config nginx
      template:
        src: templates/nginx.conf.j2
        dest: "{{ project_dir }}/nginx/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # 6. Copie du docker-compose.yml
    - name: Copie du docker-compose.yml
      template:
        src: templates/docker-compose.yml
        dest: "{{ project_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    # 7. Start
    - name: Démarrage de la stack
      command: docker compose up -d
      args:
        chdir: "{{ project_dir }}"
